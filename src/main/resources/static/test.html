<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input, select {
            width: 250px;
            padding: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 125px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h2>Add New Employee</h2>
    <form id="employeeForm">
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="lastName" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Phone Number:</label>
            <input type="text" id="phoneNumber" required>
        </div>
        <div class="form-group">
            <label>Department:</label>
            <select id="department">
                <option value="IT">IT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
            </select>
        </div>
        <div class="form-group">
            <label>Position:</label>
            <input type="text" id="position" required>
        </div>
        <div class="form-group">
            <label>Salary:</label>
            <input type="number" id="salary" step="1000" required>
        </div>
        <div class="form-group">
            <label>Address:</label>
            <input type="text" id="address">
        </div>
        <div class="form-group">
            <label>City:</label>
            <input type="text" id="city">
        </div>
        <div class="form-group">
            <label>Country:</label>
            <input type="text" id="country">
        </div>
        <button type="submit">Add Employee</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('employeeForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const employee = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                department: document.getElementById('department').value,
                position: document.getElementById('position').value,
                salary: parseFloat(document.getElementById('salary').value),
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                country: document.getElementById('country').value
            };
            
            try {
                const response = await fetch('http://localhost:8081/api/employees', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(employee)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('result').innerHTML = 
                        `<div class="result success">✅ Employee added successfully! ID: ${result.id}</div>`;
                    document.getElementById('employeeForm').reset();
                } else {
                    const error = await response.text();
                    document.getElementById('result').innerHTML = 
                        `<div class="result error">❌ Error: ${error}</div>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        };
    </script>
</body>
</html>
